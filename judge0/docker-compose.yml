x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100m

services:
  server:
    image: judge0/judge0:1.13.0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - shared:/box:rw
    ports:
      - "2358:2358"
    privileged: true
    environment:
      - AUTHENTICATION_ENABLED=false
    <<: *default-logging
    restart: always

  workers:
    image: judge0/judge0:1.13.0
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - shared:/box:rw
    privileged: true
    environment:
      - AUTHENTICATION_ENABLED=false
    <<: *default-logging
    restart: always

  db:
    image: postgres:13.0
    env_file: judge0.conf
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:6.0
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    volumes:
      - redis-data:/data
    <<: *default-logging
    restart: always

  # === 面试 AI 专用 Redis（存储会话历史）===
  session-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - session-redis-data:/data
    <<: *default-logging
    restart: always

  # === 知识库 PostgreSQL（题库 + 评价 + 评分标准）===
  kb-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=interview_kb
      - POSTGRES_USER=interview
      - POSTGRES_PASSWORD=kb_pass_2025_dev
    ports:
      - "5433:5432"
    volumes:
      - kb-postgres-data:/var/lib/postgresql/data
    <<: *default-logging
    restart: always

volumes:
  postgres-data:
  redis-data:
  session-redis-data:
  kb-postgres-data:
  shared: